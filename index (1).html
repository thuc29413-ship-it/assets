<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Isekai RPG - Infinite & Combat</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; user-select: none; -webkit-user-select: none; }
        
        /* Joystick (Bên trái) */
        #joystick-zone {
            position: absolute; bottom: 50px; left: 50px;
            width: 120px; height: 120px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.3);
            touch-action: none; z-index: 10;
        }
        #joystick-knob {
            position: absolute; top: 50%; left: 50%;
            width: 50px; height: 50px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%; transform: translate(-50%, -50%);
        }

        /* Nút tấn công (Bên phải) */
        #attack-btn {
            position: absolute; bottom: 60px; right: 50px;
            width: 80px; height: 80px;
            background: rgba(255, 0, 0, 0.6);
            border-radius: 50%; border: 3px solid white;
            color: white; font-size: 30px; display: flex;
            justify-content: center; align-items: center;
            touch-action: none; user-select: none; z-index: 10;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        #attack-btn:active { background: red; transform: scale(0.9); }

        /* Loading */
        #loading {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: white; background: rgba(0,0,0,0.8);
            padding: 20px; border-radius: 10px; font-family: Arial;
            text-align: center; pointer-events: none;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <div id="loading">Đang rèn kiếm và tạo núi...<br>0%</div>
    <div id="joystick-zone"><div id="joystick-knob"></div></div>
    <div id="attack-btn">⚔️</div>

    <script>
        // --- 1. CẤU HÌNH HỆ THỐNG ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); 
        scene.fog = new THREE.Fog(0x87CEEB, 15, 45); // Sương mù gần để giảm lag

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: false }); // Tắt khử răng cưa cho mượt
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // Ánh sáng
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.8);
        scene.add(hemiLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(10, 20, 5);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 512; // Giảm chất lượng bóng để mượt
        dirLight.shadow.mapSize.height = 512;
        scene.add(dirLight);

        // Biến toàn cục
        let player, mixer, sword;
        const clock = new THREE.Clock();
        const loader = new THREE.GLTFLoader();
        const models = {}; 
        const colliders = []; // Danh sách vật thể cản đường (đá, cây)
        const chunks = {}; // Lưu trữ map đã sinh ra
        
        // Thông số Gameplay
        const moveSpeed = 6; 
        const chunkSize = 20; // Kích thước mỗi miếng map sinh ra
        let moveInput = { x: 0, y: 0 };
        let isAttacking = false;

        // --- 2. TẢI FILE ---
        function loadModel(name, url) {
            return new Promise(resolve => {
                loader.load(url, (gltf) => {
                    models[name] = gltf.scene;
                    // Bật bóng đổ
                    models[name].traverse(c => { 
                        if(c.isMesh) { c.castShadow = true; c.receiveShadow = true; } 
                    });
                    resolve();
                }, xhr => {
                    document.getElementById('loading').innerHTML = `Đang tải... ${Math.round(xhr.loaded/xhr.total*100)}%`;
                }, err => resolve()); // Lỗi vẫn chạy tiếp
            });
        }

        Promise.all([
            loadModel('vip', 'vip.glb'),
            loadModel('dat', 'dat.glb'),
            loadModel('cay', 'cay.glb'),
            loadModel('da', 'da.glb')
        ]).then(() => {
            document.getElementById('loading').style.display = 'none';
            initGame();
        });

        // --- 3. KHỞI TẠO GAME ---
        function initGame() {
            // A. TẠO NHÂN VẬT (Thu nhỏ lại)
            if (models.vip) {
                player = models.vip;
                player.scale.set(0.4, 0.4, 0.4); // Thu nhỏ nhân vật
            } else {
                player = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1, 0.5), new THREE.MeshStandardMaterial({color:'red'}));
            }
            scene.add(player);

            // B. TẠO KIẾM (Gắn vào người)
            createSword();

            // C. ANIMATION
            if (player.animations && player.animations.length > 0) {
                mixer = new THREE.AnimationMixer(player);
                mixer.clipAction(player.animations[0]).play();
            }

            // D. TẠO NỀN XANH DỰ PHÒNG (Chống hở map)
            const ground = new THREE.Mesh(
                new THREE.PlaneGeometry(500, 500),
                new THREE.MeshLambertMaterial({ color: 0x48a14d })
            );
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -0.5;
            scene.add(ground);

            animate();
        }

        // --- 4. HỆ THỐNG VŨ KHÍ ---
        function createSword() {
            // Tự vẽ kiếm bằng khối hộp (vì chưa có file kiếm)
            const swordGroup = new THREE.Group();
            
            // Lưỡi kiếm
            const bladeGeo = new THREE.BoxGeometry(0.1, 1.5, 0.05);
            const bladeMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.8, roughness: 0.2 });
            const blade = new THREE.Mesh(bladeGeo, bladeMat);
            blade.position.y = 0.75;
            
            // Chuôi kiếm
            const handleGeo = new THREE.BoxGeometry(0.3, 0.1, 0.1);
            const handleMat = new THREE.MeshStandardMaterial({ color: 0x8B4513 });
            const handle = new THREE.Mesh(handleGeo, handleMat);
            handle.position.y = 0;

            swordGroup.add(blade);
            swordGroup.add(handle);

            // Gắn vào nhân vật (Vị trí tay phải)
            swordGroup.position.set(0.6, 1.5, 0.5); // Chỉnh vị trí tương đối
            swordGroup.rotation.x = Math.PI / 2; // Chĩa kiếm ra trước
            player.add(swordGroup);
            sword = swordGroup;
        }

        function attack() {
            if (isAttacking || !sword) return;
            isAttacking = true;
            
            // Hiệu ứng chém (Xoay kiếm)
            let duration = 0;
            const attackAnim = setInterval(() => {
                duration += 0.1;
                // Vung kiếm xuống
                sword.rotation.x = Math.PI / 2 + Math.sin(duration * 10) * 1.5;
                
                if (duration > 0.3) {
                    clearInterval(attackAnim);
                    sword.rotation.x = Math.PI / 2; // Trả về vị trí cũ
                    isAttacking = false;
                }
            }, 16);
        }

        // --- 5. MAP VÔ TẬN & ĐỊA HÌNH ---
        function updateChunks() {
            if (!player) return;
            
            // Tính xem nhân vật đang ở ô map nào
            const pX = Math.floor(player.position.x / chunkSize);
            const pZ = Math.floor(player.position.z / chunkSize);

            // Sinh map xung quanh nhân vật (3x3 ô)
            for (let x = pX - 1; x <= pX + 1; x++) {
                for (let z = pZ - 1; z <= pZ + 1; z++) {
                    const key = `${x},${z}`;
                    if (!chunks[key]) {
                        createChunk(x, z);
                        chunks[key] = true;
                    }
                }
            }
        }

        function createChunk(cx, cz) {
            const rootX = cx * chunkSize;
            const rootZ = cz * chunkSize;

            // 1. Lát Đất (Dùng 4x4 miếng nhỏ ghép lại 1 chunk to)
            if (models.dat) {
                const step = 5; 
                for(let i=0; i<4; i++) {
                    for(let j=0; j<4; j++) {
                        const dat = models.dat.clone();
                        dat.position.set(rootX + i*step, 0, rootZ + j*step);
                        dat.scale.set(5.1, 1, 5.1); // Cỏ ngắn lại (scale Y=1)
                        scene.add(dat);
                    }
                }
            }

            // 2. Sinh Vật thể (Cây & Đá)
            const objectCount = 5; // Số lượng vật thể mỗi vùng
            for (let i = 0; i < objectCount; i++) {
                const posX = rootX + Math.random() * chunkSize;
                const posZ = rootZ + Math.random() * chunkSize;
                
                const rand = Math.random();

                // Tạo Núi Đá (Gập ghềnh)
                if (rand > 0.7 && models.da) {
                    const rock = models.da.clone();
                    rock.position.set(posX, 0, posZ);
                    // Đá to nhỏ ngẫu nhiên để tạo núi
                    const s = 1 + Math.random() * 4; 
                    rock.scale.set(s, s, s);
                    rock.rotation.y = Math.random() * 6;
                    scene.add(rock);
                    
                    // Thêm vào danh sách va chạm
                    colliders.push({ mesh: rock, radius: s }); 
                }
                // Tạo Cây (To)
                else if (rand < 0.4 && models.cay) {
                    const tree = models.cay.clone();
                    tree.position.set(posX, 0, posZ);
                    tree.scale.set(8, 8, 8); // Cây to đúng tỷ lệ
                    scene.add(tree);

                    // Thêm va chạm (Gốc cây)
                    colliders.push({ mesh: tree, radius: 1.5 });
                }
            }
        }

        // --- 6. VẬT LÝ VA CHẠM ---
        function checkCollision(nextPos) {
            for (let obj of colliders) {
                // Tính khoảng cách từ vị trí dự kiến đến vật thể
                const dx = nextPos.x - obj.mesh.position.x;
                const dz = nextPos.z - obj.mesh.position.z;
                const dist = Math.sqrt(dx*dx + dz*dz);
                
                // Nếu khoảng cách nhỏ hơn bán kính -> Va chạm
                if (dist < obj.radius + 0.5) {
                    return true; // Có va chạm
                }
            }
            return false; // Không va chạm
        }

        // --- 7. ĐIỀU KHIỂN & CAMERA ---
        const joyZone = document.getElementById('joystick-zone');
        const joyKnob = document.getElementById('joystick-knob');
        let joyId = null; 
        let joyCenter = {x:0, y:0};

        // Joystick Event
        joyZone.addEventListener('touchstart', e => {
            e.preventDefault();
            const t = e.changedTouches[0];
            joyId = t.identifier;
            const rect = joyZone.getBoundingClientRect();
            joyCenter = {x: rect.left + rect.width/2, y: rect.top + rect.height/2};
            updateJoy(t);
        }, {passive:false});
        
        joyZone.addEventListener('touchmove', e => {
            e.preventDefault();
            [...e.changedTouches].forEach(t => {
                if(t.identifier === joyId) updateJoy(t);
            });
        }, {passive:false});

        joyZone.addEventListener('touchend', e => {
            [...e.changedTouches].forEach(t => {
                if(t.identifier === joyId) {
                    joyId = null;
                    joyKnob.style.transform = `translate(-50%,-50%)`;
                    moveInput = {x:0, y:0};
                }
            });
        });

        function updateJoy(t) {
            const max = 40;
            let dx = t.clientX - joyCenter.x;
            let dy = t.clientY - joyCenter.y;
            const d = Math.sqrt(dx*dx + dy*dy);
            if(d > max) { dx *= max/d; dy *= max/d; }
            joyKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
            moveInput = { x: dx/max, y: dy/max };
        }

        // Attack Event
        document.getElementById('attack-btn').addEventListener('touchstart', (e) => {
            e.preventDefault();
            attack();
        });

        // --- 8. VÒNG LẶP GAME ---
        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();

            if (player) {
                // Sinh map mới nếu đi xa
                updateChunks();

                // Di chuyển
                if (moveInput.x !== 0 || moveInput.y !== 0) {
                    // Xoay nhân vật theo hướng Joystick
                    const angle = Math.atan2(-moveInput.x, -moveInput.y);
                    const q = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0), angle);
                    player.quaternion.slerp(q, 0.2);

                    // Tính vị trí tiếp theo (Đi thẳng theo hướng mặt nhân vật)
                    const speed = moveSpeed * dt;
                    const nextX = player.position.x - Math.sin(angle) * speed;
                    const nextZ = player.position.z - Math.cos(angle) * speed;

                    // Kiểm tra va chạm trước khi đi
                    if (!checkCollision({x: nextX, z: nextZ})) {
                        player.position.x = nextX;
                        player.position.z = nextZ;
                    }
                }

                // CAMERA BÁM LƯNG (Third Person Lock)
                // Tính vị trí sau lưng nhân vật
                const camDist = 6; 
                const camHeight = 4;
                
                // Lấy hướng sau lưng nhân vật
                const backOffset = new THREE.Vector3(0, camHeight, camDist);
                backOffset.applyAxisAngle(new THREE.Vector3(0,1,0), player.rotation.y); // Xoay theo người
                
                const targetPos = player.position.clone().add(backOffset);
                camera.position.lerp(targetPos, 0.1); // Bay mượt đến sau lưng
                camera.lookAt(player.position.x, player.position.y + 1, player.position.z); // Nhìn vào đầu nhân vật

                if (mixer) mixer.update(dt);
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
